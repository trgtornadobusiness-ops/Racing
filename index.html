<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RacingK — Oval Rush</title><link rel="stylesheet" href="style.css"></head><body><div id="game-wrap"><canvas id="game"></canvas><div id="hud"><div class="hud-left"><div><span id="pos">1</span><small>POS</small></div><div><span id="lap">1/10</span><small>LAP</small></div></div><div class="hud-center"><div id="message">OVAL RUSH</div></div><div class="hud-right"><div><span id="speed">0</span><small>MPH</small></div><div><span id="gap">—</span><small>GAP</small></div><button id="audio-btn" class="audio-btn" type="button">🔊 SOUND</button></div></div>
<div id="start-screen" class="overlay"><div class="panel main-menu"><div class="eyebrow">ARCADE OVAL RACING</div><h1>RACING<span>K</span></h1><div class="sub">OVAL RUSH</div><p>High-speed open-wheel chaos. Pick your AI difficulty and go.</p><div class="difficulty"><div class="section-title">AI DIFFICULTY <span id="difficulty-label">NORMAL</span></div><div class="diff-grid"><button type="button" data-diff="easy" aria-pressed="false">EASY</button><button type="button" data-diff="normal" class="selected" aria-pressed="true">NORMAL</button><button type="button" data-diff="hard" aria-pressed="false">HARD</button><button type="button" data-diff="insane" aria-pressed="false">INSANE</button></div></div><button id="start-btn" class="primary" type="button">START RACE</button><button id="menu-audio-btn" class="menu-sound" type="button">🔊 SOUND ON</button><div class="controls"><b>W / ↑</b> Accelerate &nbsp; <b>S / ↓</b> Brake &nbsp; <b>A / ←</b> / <b>D / →</b> Move lanes<br><b>M</b> Toggle sound</div></div></div>
<div id="finish-screen" class="overlay hidden"><div class="panel"><div class="eyebrow">FINISH</div><h1>RACE COMPLETE</h1><div id="result"></div><button id="restart-btn" class="primary" type="button">RACE AGAIN</button><button id="menu-btn" class="secondary" type="button">MAIN MENU</button></div></div></div><script src="game.js"></script></body></html>
